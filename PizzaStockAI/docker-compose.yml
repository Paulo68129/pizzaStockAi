services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pizzastock
      POSTGRES_PASSWORD: pizzastock
      POSTGRES_DB: pizzastock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizzastock -d pizzastock"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://pizzastock:pizzastock@db:5432/pizzastock
      PIZZASTOCK_SECRET_KEY: change-me-in-production
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python seed.py &&
      uvicorn backend.app:app --host 0.0.0.0 --port 8000"

  frontend:
    build: .
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql+psycopg2://pizzastock:pizzastock@db:5432/pizzastock
    depends_on:
      - api
    command: streamlit run frontend/dashboard.py --server.address 0.0.0.0 --server.port 8501

volumes:
  pgdata:
